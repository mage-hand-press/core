system:
  description:
    value: >-
      <p>A collage of diagrams, maps, and small items litters the wall, pinned with nails and
      connected by a spiderweb of colorful strings. An elf stands nearby, contemplating the mystery
      splayed out in front of her and readying her crossbow for work.</p><p>A half-orc wearing a
      wide-brimmed hat leafs through a thick tome, double-checking the supplies: a sturdy net trap,
      holy symbols on the doors, cloves of garlic, and several dozen wooden stakes. The preparations
      made, the half-orc slinks into the shadows and readies himself for the bloodshed.</p><p>Blood
      dripping from its fangs and claws, a monstrously fat demon bears down on a human, who busies
      herself marking a tavern’s door frame with a few chalkmark runes. She takes a long step back
      and waits. As the demon lunges for its next meal, an invisible force lashes forth from the
      doorway, lopping off its hand and raking its stomach. The fiend howls with rage, and the
      inquisitor breathes a sigh of relief.</p><p>Supernatural detectives and monster slayers,
      investigators are always on the hunt for malevolent outsiders. Whenever evil seeps into the
      world—be it fiends, undead, or strange abominations from beyond the stars—investigators will
      be the first to locate them and banish their foul corruption from the mortal plane.</p>
