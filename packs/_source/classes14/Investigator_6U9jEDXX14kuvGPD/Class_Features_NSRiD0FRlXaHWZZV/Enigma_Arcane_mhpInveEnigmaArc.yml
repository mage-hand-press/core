      <em>@UUID[Compendium.dnd5e.spells.Item.ERCv7yuRkQ0YjGx6]{reverse gravity}</em>,
      <em>@UUID[Compendium.dnd5e.spells.Item.wvLbtemkH8gyBpdc]{sequester}</em>, or
      <em>@UUID[Compendium.dnd5e.spells.Item.L4J89JXqbKs6puEV]{teleport}</em>. Once you do so, you
      can’t cast any of these spells in this way again until you finish a long
      rest.</p><p>@Embed[Compendium.mage-hand-press-core.classes14.Item.mhpEnigmaArcane2
