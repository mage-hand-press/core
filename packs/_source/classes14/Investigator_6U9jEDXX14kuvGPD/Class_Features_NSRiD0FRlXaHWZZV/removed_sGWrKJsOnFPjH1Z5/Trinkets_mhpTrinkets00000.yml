system:
  description:
    value: >-
      <p>Investigators also collect a number of supernatural trinkets. You must be holding a trinket
      to activate it. Once you use one of your trinkets, you can’t use any of them again until you
      finish a short or long rest.</p><p>As you gain higher levels in this class, you can use your
      trinkets additional times between rests: You can use them once more at 5th level (2 uses),
      11th level (3 uses), and 17th level (4 uses).</p><p></p><p><em><strong>*Foundry
      Note:</strong></em> The user can use this feature to track number of uses.</p>
