system:
  description:
    value: >-
      <p>At 3rd level, you choose a specialization, an area of expertise in handling eldritch
      threats. Specializations are detailed at the end of the class description. Your specialization
      choice grants you features at 3rd level and again at 6th, 10th, and 14th
      level.</p><p></p><table><thead><tr><td colspan="2">Occult
      Specializations</td></tr><tr><td>Name</td><td>Description</td></tr></thead><tbody><tr><td>@UUID[Compendium.mage-hand-press-core.classes14.Item.mhpAntiquarian00]{Antiquarian}</td><td>Festooned
      with powerful magical trinkets of all shapes and
      sizes</td></tr><tr><td>@UUID[Compendium.mage-hand-press-core.classes14.Item.mhpArchivist0000]{Archivist}</td><td>A
      scholar who collects scraps of ancient
      lore</td></tr><tr><td>@UUID[Compendium.mage-hand-press-core.classes14.Item.mhpDetective0000]{Detective}</td><td>Chases
      down clues and unravels crimes with their impressive
      intellect</td></tr><tr><td>@UUID[Compendium.mage-hand-press-core.classes14.Item.mhpExterminator0]{Exterminator}</td><td>Hunts
      down vampires, lycanthropes, and beasts that stalk the
      night</td></tr><tr><td>@UUID[Compendium.mage-hand-press-core.classes14.Item.mhpInquisitor000]{Inquisitor}</td><td>An
      agent of the church that performs exorcisms and roots out
      heresy</td></tr><tr><td>@UUID[Compendium.mage-hand-press-core.classes14.Item.mhpMedium0000000]{Medium}</td><td>Foretells
      events of the future using a magical connection to the
      dead</td></tr><tr><td>@UUID[Compendium.mage-hand-press-core.classes14.Item.mhpOccultist0000]{Occultist}</td><td>A
      magician borrowing spells from wizards and
      warlocks</td></tr><tr><td>@UUID[Compendium.mage-hand-press-core.classes14.Item.mhpSpy0000000000]{Spy}</td><td>Infiltrates
      with perfect disguises and unmatched charm</td></tr></tbody></table>
