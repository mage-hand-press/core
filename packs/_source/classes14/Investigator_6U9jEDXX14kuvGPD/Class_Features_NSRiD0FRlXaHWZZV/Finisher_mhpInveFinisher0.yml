name: Finisher
type: feat
img: icons/skills/melee/maneuver-greatsword-yellow.webp
system:
  description:
    value: >-
      <p>Beginning at 11th level, you know exactly how to bring a monster down. Once on each of your
      turns when you take the Attack action and hit a creature with a weapon attack, you can deal an
      extra 2d8 damage to the creature. If the creature has less than half its hit points remaining,
      you can instead deal an extra 4d8 damage to the
      creature.<br><br><strong>*</strong><em><strong>Foundry Note:</strong> The damage can be rolled
      from this feature, the user can update the damage type on the Details tab &gt; Damage
      Formula.</em></p>
