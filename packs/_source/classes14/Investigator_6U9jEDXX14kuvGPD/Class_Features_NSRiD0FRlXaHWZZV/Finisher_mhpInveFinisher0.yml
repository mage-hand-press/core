system:
  description:
    value: >-
      <p>Beginning at 11th level, you know exactly how to bring a monster down. Once on each of your
      turns when you take the &amp;Reference[Attack] action and hit a creature with a weapon attack,
      you can deal an extra 2d8 damage to the creature. If the creature has less than half its hit
      points remaining, you can instead deal an extra 4d8 damage to the creature.</p>
