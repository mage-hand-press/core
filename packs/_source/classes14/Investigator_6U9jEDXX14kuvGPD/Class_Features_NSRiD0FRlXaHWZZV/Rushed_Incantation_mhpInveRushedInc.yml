folder: NSRiD0FRlXaHWZZV
name: Rushed Incantation
type: feat
img: icons/sundries/books/book-worn-brown-grey.webp
system:
  description:
    value: >-
      <p>Beginning at 2nd level, you can hastily perform any ritual spell in your grimoire that has
      a casting time of 1 action or 1 bonus action, completing the ritual as a bonus action. If the
      spell requires material components worth 100 gp or less, you can cast it without providing
      those components. You can use this feature a number of times equal to your Intelligence
      modifier (a minimum of once), and you regain all expended uses when you finish a long
      rest.</p><p>As you gain higher levels in this class, you can use this feature additional
      times. You can use it once more at 5th level (Intelligence modifier + 1), 9th level
      (Intelligence modifier + 2), 13th level (Intelligence modifier + 3), and 17th level
      (Intelligence modifier + 4).</p>
