system:
  description:
    value: >-
      <p>Using a special alchemical process requiring 8 hours of work, which can be performed over
      the course of a long rest, you can create a
      @UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.bestiary.Actor.pGjdxJ7eqg1od1XS]{homunculus}.
      A homunculus functions as a familiar summoned by the
      <em>@Compendium[dnd5e.spells.JGT5bNqu9REL7Fuz]{Find Familiar}</em> spell, with several
      differences:</p><ul><li>The telepathic link between you and your homunculus functions at any
      distance, provided you and your homunculus are on the same plane of existence.</li><li>You
      can’t dismiss your homunculus as you would a familiar.</li><li>Your homunculus is a Construct
      and can’t assume a different form.</li><li>Your homunculus can take the Attack action on its
      turn.</li></ul><p>When your homunculus dies, its body remains, and can be reanimated in a
      procedure requiring 1 hour of work, which can be performed over the course of a short or long
      rest.</p>
