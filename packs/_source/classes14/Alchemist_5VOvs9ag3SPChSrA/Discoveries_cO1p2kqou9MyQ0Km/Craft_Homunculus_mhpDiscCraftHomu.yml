system:
  description:
    value: >-
      <p>Using a special alchemical process requiring 8 hours of work, which can be performed over
      the course of a long rest, you can create a
      @UUID[Compendium.dnd5e.monsters.Actor.ZQTCZfTV9ZoTjNCU]{homunculus}. A homunculus functions as
      a familiar summoned by the <em>@Compendium[dnd5e.spells.JGT5bNqu9REL7Fuz]{Find Familiar}</em>
      spell, with several differences:</p><ul><li><p>The telepathic link between you and your
      homunculus functions at any distance, provided you and your homunculus are on the same plane
      of existence.</p></li><li><p>You can’t dismiss your homunculus as you would a
      familiar.</p></li><li><p>Your homunculus is a Construct and can’t assume a different
      form.</p></li><li><p>Your homunculus can take the Attack action on its
      turn.</p></li></ul><p>When your homunculus dies, its body remains, and can be reanimated in a
      procedure requiring 1 hour of work, which can be performed over the course of a short or long
      rest.</p>
