system:
  description:
    value: >-
      <p><em>Prerequisites: 13th level, Mutagenist Field of Study</em></p>

      <p>You’ve developed a powerful, but fleeting way to blend your mutagens. When you inject
      yourself with a mutagen, you can choose to inject a tri-mutagen, which grants you the benefit
      of all your mutagens at once. This benefit lasts for 1 minute, or until you inject yourself
      with a different mutagen. Once you use this ability, you can’t use it again until you finish a
      long rest.</p>
