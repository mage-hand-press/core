system:
  description:
    value: >-
      <p><em>Prerequisites: 13th level, Apothecary Field of Study</em></p><p>Whenever a creature
      regains hit points by drinking one of your potions, it gains resistance to bludgeoning,
      piercing, and slashing damage from nonmagical attacks until the end of its next
      turn.</p><p></p><p><em><strong>*Foundry Note:</strong> The GM can drag the active effect from
      this feature to the creature targeted.</em> </p>
