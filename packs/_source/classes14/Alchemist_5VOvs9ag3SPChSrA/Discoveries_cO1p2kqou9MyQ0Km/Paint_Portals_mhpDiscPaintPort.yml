  description:
    value: >-
      <div class="item-entry-details"><p class="item-entry-tag">Prerequisite: 13th level, Pigmintist
      Field of Study</p></div><p> Through some clever paint mixing, you have infused your paint with
      a small amount of conjuration magic. Once on each of your turns, you can use 10 feet of your
      movement to enter any area of wet paint within 5 feet of you, emerging from another area of
