    value: >-
      <div class="item-entry-details"><p class="item-entry-tag">Prerequisites: 13th level, Ooze
      Rancher Field of Study</p></div><p>Tired of waiting for your Oozes to catch up with you,
      you’ve modified your formula to make extra fast slimes! All slimes you make have a speed of 30
      feet, unless it was already higher. Additionally, you can ride any Ooze you make of Medium
      size or larger as a mount. You and your equipment suffer no ill effect from touching your
      Oozes directly. Lastly, your Oozes add your proficiency bonus to their damage rolls and
      initiative rolls.</p>
