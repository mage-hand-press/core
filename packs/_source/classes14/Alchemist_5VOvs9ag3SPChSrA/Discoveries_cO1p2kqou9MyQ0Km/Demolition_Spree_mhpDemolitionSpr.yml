system:
  description:
    value: >-
      <p><em>Prerequisite: 13th level, Mad Bomber Field of Study</em></p>

      <p>When you prime and throw a bomb, you can choose to throw a number of bombs equal to the
      amount of damage dice for the bomb instead of only one. Each bomb you throw deals 1d10 damage
      plus your Intelligence modifier and can’t target the same creature or space. You must spend
      reagent dice separately on these bombs and can apply a bomb formula to only one of them.</p>
