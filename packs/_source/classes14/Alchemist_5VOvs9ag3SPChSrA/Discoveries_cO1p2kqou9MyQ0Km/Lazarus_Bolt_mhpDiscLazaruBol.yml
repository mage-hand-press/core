system:
  description:
    value: >-
      <p><em>Prerequisite: 9th level</em></p>

      <p>You’ve discovered a radical necromantic workaround: restoring life with direct electricity
      to the heart. As an action, you can drive a bolt into the torso of a creature within 5 feet of
      you that has died within the last minute and shock it back to life. That creature returns to
      life with 1 hit point. This feature can’t return to life a creature that lacks a heart, a
      creature that has died of old age, or a creature that is missing vital organs.</p>

      <p>Once you use this ability, you can’t use it again until you finish a short or long
      rest.</p>
