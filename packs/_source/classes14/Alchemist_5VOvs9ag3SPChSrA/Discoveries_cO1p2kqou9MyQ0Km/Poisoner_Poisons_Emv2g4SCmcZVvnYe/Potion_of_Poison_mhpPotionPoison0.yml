name: Potion of Poison
type: consumable
img: icons/consumables/potions/potion-bottle-skull-label-poison-teal.webp
system:
  description:
    value: >-
      <p><em>This concoction looks, smells, and tastes like a potion of healing or other beneficial
      potion.</em></p><p>However, it is actually poison masked by illusion magic. An identify spell
      reveals its true nature.</p><p>If you drink it, you take 3d6 poison damage, and you must
      succeed on a DC 13 Constitution saving throw or be poisoned. At the start of each of your
      turns while you are poisoned in this way, you take 3d6 poison damage. At the end of each of
      your turns, you can repeat the saving throw. On a successful save, the poison damage you take
      on your subsequent turns decreases by 1d6. The poison ends when the damage decreases to
      0.</p><section class="secret foundry-note" id="secret-lK9L9LydgGgQJzNL"><p><strong>Foundry
      Note</strong></p><p>To apply the reduced damage from a successful Constitution save, please
      use the Other Formula (set at 1d6) as required.</p></section>
