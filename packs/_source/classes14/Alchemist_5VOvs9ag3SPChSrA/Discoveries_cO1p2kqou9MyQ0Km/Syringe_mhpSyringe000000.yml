  description:
    value: >-
      <p>Using a sophisticated hypodermic needle, you can more quickly administer potions and
      poisons. As a bonus action, you can inject a potion into yourself or a willing creature within
      5 feet of you, granting the benefits of the potion as if it were consumed normally. You can
      inject a potion into an unwilling creature with a successful melee attack, treating the
      syringe as a finesse weapon.</p>
