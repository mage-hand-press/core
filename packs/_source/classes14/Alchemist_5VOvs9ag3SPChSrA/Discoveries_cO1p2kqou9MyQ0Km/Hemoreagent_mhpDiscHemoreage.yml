system:
  description:
    value: >-
      <p><em>Prerequisite: 17th level</em></p><p>When you prime and throw a bomb, you can convert a
      measure of your own blood into reagents. You can add five or fewer reagent dice to the bomb’s
      damage roll without expending them, and you take 1d6 necrotic damage for each reagent die
      added. This damage can’t be reduced or prevented in any way.</p><p></p><p><em><strong>*Foundry
      Note:</strong> The user can declare how many reagent dice they are using and then use the
      Other formula that many times to calculate the damage they take from this feature.</em></p>
