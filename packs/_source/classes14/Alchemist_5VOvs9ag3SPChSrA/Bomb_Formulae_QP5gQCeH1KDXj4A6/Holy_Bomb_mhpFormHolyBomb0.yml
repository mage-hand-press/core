system:
  description:
    value: >-
      <p>By adding a few drops of holy water to your bomb’s explosive contents, you can change it
      into a holy bomb. A holy bomb deals radiant damage instead of fire damage, and its damage dice
      are d8s, unless the target is a Celestial, Fiend, or Undead. The bomb’s damage dice are d6s
      against Celestials and d12s against Fiends and Undead.</p><p></p><p><em><strong>*Foundry
      Note:</strong> Use the Versatile Damage Formula for the Celestials d6 damage, and the Other
      Formula for the d12s against Fiends and Undead.</em></p>
