system:
  description:
    value: >-
      <p>By mixing your bomb’s explosive components with a powerful desiccating agent, you can
      change it into a withering bomb. A withering bomb deals necrotic damage instead of fire
      damage, its damage dice are d8s, it requires a Constitution saving throw, instead of a
      Dexterity saving throw. Additionally, the target, as well as each creature within the blast
      radius that fails its saving throw, can’t regain hit points until the end of its next
      turn.</p>
