system:
  description:
    value: >-
      <p>By removing your bomb’s explosive contents entirely, you can change it into a smoke bomb. A
      smoke bomb deals no damage but fills a 10-foot-radius sphere with smoke. This smoke spreads
      around corners and its area is heavily obscured. It lasts for a number of rounds equal to your
      Intelligence modifier (minimum of 1 round) or until a wind of moderate or greater speed (at
      least 10 miles per hour) disperses it. Once you throw one of these bombs, you can’t throw
      another one for 1 minute.</p><p></p><p><em><strong>*Foundry Note:</strong> The user can use
      the 'Other Formula' to calculate the number of rounds the smoke lasts.</em></p>
