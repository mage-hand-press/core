system:
  description:
    value: "<p><em>Requirement:\_Amorist</em></p><p>Starting at 2nd level, you can replace your bomb’s explosive contents with a potent pheromone, changing it into a pheromone bomb. A pheromone bomb requires a Wisdom saving throw, instead of a Dexterity saving throw. The bomb deals no damage, and instead causes the target, as well as each creature within the blast radius that fails its saving throw, to be charmed by you until the end of its turn or until it takes damage.</p>"
