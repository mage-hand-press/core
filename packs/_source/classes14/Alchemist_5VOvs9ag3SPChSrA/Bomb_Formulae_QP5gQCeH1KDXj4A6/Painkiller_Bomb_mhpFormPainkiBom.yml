system:
  description:
    value: "<p><em>Requirements:\_\_Apothecary</em></p><p>At 2nd level, you can mix your bomb’s contents with analgesic oil, changing it into a painkiller bomb. A painkiller bomb deals no damage and doesn't have a blast radius. On a hit, roll damage as normal; the target instead gains temporary hit points which last for 1 minute equal to the total damage roll. You can target a willing creature with this bomb without making an attack roll. Once you throw one of these bombs, you can’t throw another one for 1 minute.</p>"
