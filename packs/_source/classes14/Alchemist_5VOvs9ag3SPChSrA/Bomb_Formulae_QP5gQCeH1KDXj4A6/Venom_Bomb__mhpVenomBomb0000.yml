system:
  description:
    value: "<p><em>Requirements:\_Venomsmith</em></p><p>At 2nd level, you can mix a few drops of a fast-acting toxin into your bomb’s explosive components, changing it into a venom bomb. A venom bomb deals poison damage instead of fire damage, its damage dice are d8s, and it requires a Constitution saving throw instead of a Dexterity saving throw. Additionally, the target, as well as each creature within the blast radius that fails its saving throw, has disadvantage on the next Strength, Dexterity, or Constitution saving throw it makes before the end of its next turn.</p>"
