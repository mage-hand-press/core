  description:
    value: "<p><em>Requirements:</em>\_<em>Dynamo Engineer</em></p><p>Starting at 6th level, you can craft arcano bombs. By adding an unexpended dynamo to your bomb (and thus expending the dynamo’s spell slot), you can change it into an arcano bomb. An arcano bomb deals force damage instead of fire damage, its damage dice are d12s, and it deals one extra die of damage, as if a reagent die were added to it.</p>"
