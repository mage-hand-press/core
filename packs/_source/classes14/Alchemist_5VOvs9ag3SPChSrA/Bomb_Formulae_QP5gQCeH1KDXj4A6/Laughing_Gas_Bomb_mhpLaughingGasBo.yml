system:
  description:
    value: >-
      <p>By mixing your bomb’s explosive contents with a drop of jesterate, a highly euphoric
      chemical, you can change it into a laughing gas bomb. A laughing gas bomb deals poison damage
      instead of fire damage, its damage dice are d6s, and it requires a Constitution saving throw,
      instead of a Dexterity saving throw. Additionally, the target, as well as each creature within
      the blast radius that fails its saving throw, falls prone in a fit of laughter. Once a
      creature falls prone due to this bomb’s effects, it is immune to this effect (but not the
      bomb’s poison damage) for the next 24 hours.</p>
