system:
  description:
    value: >-
      <p>By replacing your bomb’s explosive contents with a pouch of rubber pellets, you can change
      it into a nonlethal bomb. A nonlethal bomb deals bludgeoning damage instead of fire damage,
      and its damage dice are d8s. If damage from this bomb drops a creature to 0 hit points, it
      knocks the creature out, rather than dealing a killing blow, rendering the creature
      unconscious and stable. Additionally, this bomb’s rubber pellets bounce around corners,
      ignoring half and three-quarters cover for targets within the blast radius.</p>
