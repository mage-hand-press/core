system:
  description:
    value: >-
      <p>By 2nd level, your research has granted you insight into new alchemical formulations for
      your bombs. Select three bomb formulae from the Bomb Formulae section. Once per turn when you
      prime a bomb, you can apply a formula to it. Applying a formula sometimes changes all of the
      damage dice rolled for a bomb, but also grants it special effects.</p><p>When you gain certain
      levels in this class, you learn additional formulae of your choice, as shown in the Bomb
      Formulae Known column of the Alchemist table. Additionally, when you gain a level in this
      class, you can choose one of the formulae you know and replace it with another formula.</p>
