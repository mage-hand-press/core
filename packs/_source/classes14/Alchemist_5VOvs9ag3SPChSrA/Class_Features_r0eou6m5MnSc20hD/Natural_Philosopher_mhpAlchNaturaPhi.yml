system:
  description:
    value: >-
      <p>You have learned many things about alchemy during your studies. Starting at 1st level, you
      can add half your proficiency bonus, rounded up, to any ability check you make to identify
      herbs, potions, poisons, or other alchemical substances. If the ability check already includes
      your proficiency bonus, you can add this bonus in addition to your normal proficiency
      bonus.</p><p></p><p><em><strong>*Foundry Note:</strong> the Other formula can be used to
      calculate the bonus received from this feature.</em></p>
