system:
  description:
    value: >-
      <p>At 1st level, you can create volatile alchemical bombs using your alchemist’s supplies.
      Whenever you finish a short or long rest, you can create a number of bombs equal to 10 + twice
      your alchemist level. For you the cost of materials necessary to create these bombs is
      negligible. After 24 hours, an unused bomb becomes inert. The statistics of a bomb are shown
      in the Bomb sidebar.</p><div class="notable"><h4>Bomb</h4><p>Bombs are exotic ranged weapons
      with the following
      statistics:</p><p>@Embed[Compendium.mage-hand-press-core.journal.JournalEntry.mhpEmbeds5e00000.JournalEntryPage.mhpBomb000000000
      inline]</p><h3>Special Property</h3><p><em><strong>Bomb.</strong></em> When a bomb hits a
      target, it explodes in a 15-foot diameter sphere and is destroyed. The bomb can be thrown at
      an unoccupied space within its range. Each creature other than the target within the blast
      radius (for a Medium or smaller target, each creature within 5 feet of it) must make a DC 11
      Dexterity saving throw, taking half the damage rolled on a failed save, or no damage on a
      successful one.</p><p>Additionally, as a bonus action, you can empty some of the bomb’s
      explosive material to permanently remove the blast radius from this bomb, dealing damage only
      to the bomb’s target.</p></div><p><em><strong>Priming Bombs.</strong></em> Once per turn you
      can take the Use an Object action to prime a bomb with explosive reagents and make an attack
      with it, increasing the bomb’s explosive potential. When you do so, you can add your
      Intelligence modifier, instead of Dexterity, to the bomb’s damage roll.</p><p>Additionally,
      when you throw a bomb in this way, its damage increases by 1d10 when you reach 5th level
      (2d10), 11th level (3d10), and 17th level (4d10).</p><p><em><strong>Saving
      Throws.</strong></em> When you throw a bomb, the save DC for its blast radius is calculated as
      follows:</p><p style="text-align:center"><strong>Bomb save DC</strong> = 8 + your proficiency
      bonus + your Intelligence modifier</p>
