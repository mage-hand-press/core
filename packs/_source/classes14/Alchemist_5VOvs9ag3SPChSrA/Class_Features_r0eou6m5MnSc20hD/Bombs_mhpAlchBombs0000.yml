system:
  description:
    value: >-
      <p>At 1st level, you can create volatile alchemical bombs using your alchemist’s supplies.
      Whenever you finish a short or long rest, you can create a number of bombs equal to 10 + twice
      your alchemist level. For you the cost of materials necessary to create these bombs is
      negligible. After 24 hours, an unused bomb becomes inert. The statistics of a bomb are shown
      @UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.classes14.Item.mhpBomb000000000]{here}.</p><p><em><strong>Priming
      Bombs.</strong></em> Once per turn you can take the Use an Object action to prime a
      @UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.classes14.Item.mhpPrimedBomb000]{bomb}
      with explosive reagents and make an attack with it, increasing the bomb’s explosive potential.
      When you do so, you can add your Intelligence modifier, instead of Dexterity, to the bomb’s
      damage roll.</p><p>Additionally, when you throw a bomb in this way, its damage increases by
      1d10 when you reach 5th level (2d10), 11th level (3d10), and 17th level
      (4d10).</p><p><em><strong>Saving Throws.</strong></em> When you throw a bomb, the save DC for
      its blast radius is calculated as follows:</p><p style="text-align:center"><em><strong>Bomb
      save DC</strong></em> = 8 + your proficiency bonus + your Intelligence
      modifier</p><p></p><p><em><strong>*Foundry Note:</strong> the user can roll the 'Other'
      formula to calculate the number of bombs they get per day.</em></p>
