system:
  description:
    value: >-
      <p>At 20th level, you unlock the crowning achievement of all alchemy: a philosopher’s stone, a
      dynamo of alchemical energy in a fist-sized, glowing jewel. You can construct your
      philosopher’s stone using your alchemist’s supplies, 1,000 gp worth of materials, and 7 days
      of work. You can only have one philosopher’s stone at a time. As long as you possess the
      stone, you gain the following benefits:</p><p>• Whenever you finish a short rest, you regain
      all expended reagent dice.</p><p>• You can brew potions as an action, instead of over the
      course of 10 minutes.</p><p>• You age 10 times slower than normal, and you can’t be aged
      magically.</p><p>Additionally, you learn the following formula, which doesn’t count against
      the total number of formulae you
      know:</p><p>@Embed[Compendium.mage-hand-press-core.classes14.Item.mhpFormNucleaBom
      caption=false cite=false nameStyle=h5]{Formula: Nuclear Bomb}</p>
