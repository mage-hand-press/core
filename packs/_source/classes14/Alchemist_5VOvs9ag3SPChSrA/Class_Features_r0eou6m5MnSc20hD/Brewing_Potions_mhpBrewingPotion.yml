name: Brewing Potions
type: feat
img: icons/tools/laboratory/cauldron-filled-gold.webp
system:
  description:
    value: >-
      <p>You can spend 10 minutes and expend any number of reagent dice to brew potions. These
      potions retain potency for 24 hours, after which they become inert. If a potion calls for a
      saving throw, it uses your bomb save DC.</p><p>The number of reagent dice and the alchemist
      level required to brew a potion are given on the Potions
      table.</p><p>@Embed[Compendium.mage-hand-press-valdas-spire-of-secrets.journal14.JournalEntry.mhpTables0000000.JournalEntryPage.mhpPotions000000
      inline]</p><h3></h3><p><em><strong>*Foundry Note:</strong> The default reagent die consumption
      is 1, if the user decides to spend more than 1 die they will have to update the
      'itemconsumption' on the Details tab before completing the action.</em></p>
