system:
  description:
    value: >-
      <p>You start with three reagent dice, which are d10s, and you gain additional reagent dice as
      you gain levels in this class, as shown in the Reagent Dice column of the Alchemist table. You
      regain all expended reagent dice when you finish a long rest.</p><p>When you use a
      @UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.classes14.Item.mhpPrimedBomb000]{primed
      bomb}, you can expend a number of reagent dice up to your proficiency bonus and add the dice
      to the bomb’s damage roll.</p>
