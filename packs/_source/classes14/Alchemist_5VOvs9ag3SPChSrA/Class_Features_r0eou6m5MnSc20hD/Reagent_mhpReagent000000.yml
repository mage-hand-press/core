system:
  description:
    value: >-
      <p>Starting at 3rd level, you have a collection of powerful alchemical reagents, represented
      by a pool of reagent dice, that you can spend to brew potions or magnify the power of your
      explosives.</p><h3 data-no-toc>Reagent Dice</h3><p>You start with three
      @UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.classes14.Item.mhpReagentDice00]{reagent
      dice}, which are d10s, and you gain additional reagent dice as you gain levels in this class,
      as shown in the Reagent Dice column of the Alchemist table. You regain all expended reagent
      dice when you finish a long rest.</p><p>When you prime a
      @UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.classes14.Item.mhpBombs00000000]{bomb},
      you can expend a number of reagent dice up to your proficiency bonus and add the dice to the
      bomb’s damage roll.</p><h3 data-no-toc>Brewing Potions</h3><p>You can spend 10 minutes and
      expend any number of reagent dice to
      @UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.classes14.Item.mhpBrewingPotion]{brew
      potions}. These potions retain potency for 24 hours, after which they become inert. If a
      potion calls for a saving throw, it uses your bomb save DC.</p><p>The number of reagent dice
      and the alchemist level required to brew a potion are given on the Potions
      table.</p><p></p><table><thead><tr><td
      colspan="3"><p>Potions</p></td></tr><tr><td><p>Potion</p></td><td><p>Cost</p></td><td><p>Alchemist
      Level</p></td></tr></thead><tbody><tr><td><p>@UUID[Compendium.dnd5e.items.aMnWi1WXWpxRHq4r]{Potion
      of Climbing}</p></td><td><p>1 reagent
      die</p></td><td><p>3rd</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.gTRFQLdVD1gsKtPi]{Potion
      of Growth}</p></td><td><p>1 reagent
      die</p></td><td><p>3rd</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.ytlsBjYsZ7OBSEBs]{Potion
      of Healing}</p></td><td><p>1 reagent
      die</p></td><td><p>3rd</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.CAZMwFBWp9VC0ZCg]{Potion
