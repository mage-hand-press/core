system:
  description:
    value: >-
      <p>A grinning gnome cackles with glee as he hurls a bomb into a group of charging goblins,
      blasting them into scorched chunks. He produces another, throws it at his feet, and
      disappears, still laughing, into the ensuing cloud of smoke.</p><p>A slender elf quickly mixes
      liquids and herbs in a small bowl. She applies the mixture to an arrow wound on an injured
      dwarf’s side, which immediately stops bleeding.</p><p>Whether their methods are explosive,
      transformative, or restorative, alchemists live to transmute the world around them to their
      liking.</p>
