  description:
    value: >-
      <p>When you hit a creature with a ranged weapon attack, you can expend one risk die as a bonus
      action and aim for one of its limbs, attempting to force it to drop one item of your choice
      that it’s holding. The target must make a Constitution saving throw. On a failed save, it
      drops the object you choose. The object lands at its feet.</p>
