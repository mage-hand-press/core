  - sort: 500000
    name: Occult Specializations
    type: text
    _id: mhpOccultSpecial
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1 data-no-toc class="subchapter">Occult Specializations</h1><p>Investigators of all
        stripes share the broad goal of combating the occult, but their methods vary wildly. Some
        emphasize cutting down monsters and banishing demons, while others believe that uncovering
        secrets and compiling critical information is the surest method for eliminating supernatural
        threats. When an investigator gains enough experience, they can steer their approach,
        including the specific techniques they employ and the trinkets they carry, into an occult
        specialization, a school of thought for handling eldritch
        threats.</p><p>@Embed[Compendium.mage-hand-press-core.journal14.JournalEntry.mhpTables0000000.JournalEntryPage.mhpOccultSpecial
        inline]</p>
