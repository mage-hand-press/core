    name: Oil Bomb
    type: text
    category: MXEwg4kpNJw5Vyrp
    _id: mhpOilBomb000000
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>By mixing your bomb’s explosive contents with a few drops of a super-surfactant, you can
        change it into an oil bomb. An oil bomb deals no damage, but coats each creature within the
        blast radius in a sticky, flammable oil. The next time a creature coated in oil takes fire
        damage, it takes an extra d6 damage for each die of fire damage rolled, up to a maximum of
        half your alchemist level, rounded up. This oil can be removed by dousing a creature with a
        gallon of water.</p>
