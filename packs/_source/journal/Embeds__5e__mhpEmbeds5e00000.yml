    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>By adding a thickening agent to your bomb’s explosive contents, you can change it into an
        incendiary bomb. An incendiary bomb’s damage dice are d6s. Additionally, the area of the
        blast radius is engulfed in flames, which persist until the start of your next turn.
        Flammable objects in this area that aren’t being worn or carried ignite. Any creature that
