  - sort: 1800000
    name: Acid Bomb
    type: text
    category: MXEwg4kpNJw5Vyrp
    _id: mhpAcidBomb00000
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: "<p>By mixing your bomb’s explosive contents with a few drops of ardenflotic acid, a highly corrosive chemical, you can change it into an acid bomb. An acid bomb deals acid damage instead of fire damage, and its damage dice are d4s. Additionally, the target, as well as each creature within the blast radius that fails its saving throw, takes the same amount of damage again at the end of its next turn.\_</p>"
    video:
      controls: true
      volume: 0.5
