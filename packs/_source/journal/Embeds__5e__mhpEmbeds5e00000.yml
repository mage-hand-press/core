  - sort: 5500000
    name: Missed Bomb
    type: text
    category: MXEwg4kpNJw5Vyrp
    _id: mhpMissedBomb000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <aside class="notable"><h4>Missed Bomb</h4><p>As bombs are explosive projectiles, it makes
        sense to ask what happens if a thrown bomb fails to hit its target. For simplicity, we
        assume that missed bombs explode harmlessly in the background or fail to detonate
        altogether, but do not explode in the target’s space and deal damage with its blast radius.
        The GM can decide which of these two outcomes happens or can determine the outcome
        randomly.</p></aside>
