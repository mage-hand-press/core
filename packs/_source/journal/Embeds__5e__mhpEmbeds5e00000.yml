      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>By replacing your bomb’s explosive contents with a piece of ice-nine, you can change it
        into a cryo bomb. A cryo bomb deals cold damage instead of fire damage, its damage dice are
        d8s, and it requires a Constitution saving throw, instead of a Dexterity saving throw.
        Additionally, the target, as well as each creature within the blast radius that fails its
        saving throw, has its speed reduced by 10 feet until the end of its next turn.</p>
