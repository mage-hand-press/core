  - sort: 2900000
    name: Psionic Bomb
    type: text
    category: MXEwg4kpNJw5Vyrp
    _id: mhpPsionicBomb00
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>By mixing your bomb’s explosive contents with dust from a psionic crystal, you can change
        it into a psionic bomb. A psionic bomb deals psychic damage instead of fire damage, its
        damage dice are d6s, and it requires a Wisdom saving throw, instead of a Dexterity saving
