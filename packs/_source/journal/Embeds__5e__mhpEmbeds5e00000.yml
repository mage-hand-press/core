  - sort: 1900000
    name: Bramble Bomb
    type: text
    category: MXEwg4kpNJw5Vyrp
    _id: mhpBrambleBomb00
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>By adding a potent fertilizer to your bomb’s explosive contents, you can change it into a
        bramble bomb. A bramble bomb deals no damage, but instead causes tough, thorny brambles to
        sprout from any area of natural ground within the bomb’s blast radius, which becomes
        &amp;Reference[difficult terrain]{difficult terrain}. Additionally, if a creature in the
        blast radius is prone when the bomb detonates, it is enveloped by the brambles and must
        succeed on a Strength (Athletics) check against your bomb save DC before it can move or
        stand. The brambles shrivel and die after 1 minute.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    ownership:
      default: -1
    flags: {}
    _stats:
      coreVersion: '14.367'
