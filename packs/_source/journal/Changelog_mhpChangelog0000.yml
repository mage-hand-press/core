  - sort: -100000
    name: Version 2.0.0
    type: text
    _id: mhpVersion200000
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h3 data-no-toc>Version 2.0.0</h3><ul><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/29" title="Add bonus to
        check &amp; save activities">#29</a>] Added risk die bonus to Disguised Shot (5e) &amp;
        Fancy Gunplay (5e) deeds</p></li><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/30" title="Add attack
        advantage/disadvantage">#30</a>] Added attack disadvantage to Gut Shot (5e &amp;
        5.5e)</p></li><li><p>[<a href="https://github.com/mage-hand-press/premium-content/issues/34"
        title="Add area of effect region behaviors">#34</a>] Silent Cantrip (5e &amp; 5.5e) now adds
        Silenced effect to anyone in region</p></li><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/39" title="Add teleport
        activities">#39</a>] Switched to teleport activities for Bishop's Maneuver (5.5e) and Castle
        (5e &amp; 5.5e)</p></li><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/44" title="Make use of new
        AC formula support">#44</a>] Updated Cloak of Feathers (5e) to only work without armor &amp;
        shield</p></li><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/45" title="Use new
        &quot;Start/End of Source/Target's Next Turn&quot; expiry in AEs">#45</a>] Set start of turn
        duration on Blinding Light (5e &amp; 5.5e) &amp; Silent Cantrip (5e &amp; 5.5e)
        tricks</p></li><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/53" title="Add support for
        Auxiliary Levels">#53</a>] Implemented Auxiliary Levels support</p></li><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/54" title="Add exotic weapon
        categories for non-firearms">#54</a>] Added Exotic Simple and Exotic Martial weapon
        categories, adjust ordering</p></li><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/55" title="Add support for
        Monstrous Grafts">#55</a>] Added Monstrous Graft equipment &amp; weapon types, graft tab on
        actor sheets</p></li><li><p>[<a
        href="https://github.com/mage-hand-press/premium-content/issues/56" title="Use enchantments
        to add new abilities to attack activity">#56</a>] Signature Focus now adds to attack's
        ability options, rather than just replacing</p></li><li><p>Remove unused effects from
        Blindfire &amp; Opening Move</p></li></ul>
