      description:
        value: >-
          <p>@Embed[Compendium.mage-hand-press-core.classes14.Item.mhpClasAlchemist caption=false
          nameStyle=h1 no-toc]</p><h2>Chemical Reactions</h2><p>One of the first things an alchemist
          learns is how to mix chemicals that react explosively with each other. Ostensibly, this is
          taught to students to prevent deadly accidents, but adventuring alchemists regularly apply
          this knowledge to create bombs.</p><p>An alchemical bomb is a 1-pound, apple-sized,
          spherical glass or clay flask filled with a reactive chemical. A smaller vial of thin
          glass containing a reagent is suspended in the liquid, and the whole thing is sealed with
          a cork or wax seal. The chemicals violently explode when mixed. This occurs when the inner
          vial breaks, usually after the bomb impacts a solid surface or a fuse sets off a small
          explosive detonator within the vial. Bombs are primarily used to fend off enemies, but
          creative alchemists may find more practical uses for explosives, such as demolishing
          obstacles.</p><h2>Serums and Tinctures</h2><p>More experienced alchemists learn to mix
          less volatile substances into potions, alchemical concoctions that replicate magical
          effects. These potions range from the medicinal, such as <em>potions of healing</em>, to
          the transformative, such as <em>potions of gaseous form</em>, to the downright deadly,
          such as <em>potions of poison</em>. Undisputed masters of potions, alchemists constantly
          innovate with new formulations and preparations, improving their potions into magic items
          in their own right.</p><h2>Elemental Sciences</h2><p>The primary source of alchemy’s power
          comes from the elemental planes. It is no surprise, then, that alchemists strive to tap
          deeper into that power, researching and discovering new compounds composed of the
          elements. The pinnacle of alchemy is the philosopher’s stone, which is rumored to grant
          its bearer supreme elemental power. Few alchemists have succeeded in creating a
          philosopher’s stone, and fewer still remain alive to divulge its secrets.</p><h2>Creating
          an Alchemist</h2><p>When you create an alchemist, consider why you study alchemy. Are you
          attracted to its dangerous power or its ability to help others? Do you desire to use
          magic, but lack the aptitude or inborn ability?</p><p>Why do you adventure? Are you
          searching for new alchemical formulae or rare ingredients? Do you, like so many, seek the
          philosopher’s stone?</p><p>Be sure to understand alchemy’s place in your campaign world.
          You might have learned your trade from a master or studied alongside artificers and
          wizards in a university. Your trade might be commonplace or an oddity. Depending on the
          setting, you might be respected for your knowledge or feared for your destructive
          potential.</p><h3>Quick Build</h3><p>You can make an alchemist quickly by following these
          suggestions. First, make Intelligence your highest ability score, followed by Dexterity.
          Choose any background of your choice, preferably one that lends insight into your history
          with alchemy.</p>
