      content: >-
        <h1 data-no-toc class="subchapter">Discoveries</h1><p>If a discovery has prerequisites, you
        must meet them to learn it. You can learn the discovery at the same time that you meet its
        prerequisites. A level prerequisite refers to your level in this class. You can only learn a
        discovery once, unless otherwise specified.</p><div class="hide-secrets"><h3>Advanced
        Poisoner</h3><p><em>Prerequisites: 13th level, Venomsmith Field of Study</em></p><p>Your
        morbid research into the most vicious, exotic poisons allows you to brew the following
        poisons (found
        @UUID[Compendium.dnd5e.rules.t6scHTmpmHBTZGTX.JournalEntryPage.B8rYvLQ4jMY9GeJA#sample-poisons]{Here})
        when you brew
        potions:</p><p></p><table><thead><tr><td><p>Potion</p></td><td><p>Cost</p></td></tr></thead><tbody><tr><td><p>Burnt
        Othur Fumes</p></td><td><p>3 reagent dice</p></td></tr><tr><td><p>Crawler
        Mucus</p></td><td><p>3 reagent dice</p></td></tr><tr><td><p>Drow Poison</p></td><td><p>3
        reagent dice</p></td></tr><tr><td><p>Pale Tincture</p></td><td><p>4 reagent
        dice</p></td></tr><tr><td><p>Midnight Tears</p></td><td><p>5 reagent
        dice</p></td></tr><tr><td><p>Wyvern Poison</p></td><td><p>6 reagent
        dice</p></td></tr></tbody></table><p></p><h3>Alchemy of Ascendancy</h3><p><em>Prerequisite:
        17th level</em></p><p>A breakthrough in your alchemical studies has revealed the formulation
        of several potent elixirs. You can brew the following
        potions:</p><p></p><table><thead><tr><td><p>Potion</p></td><td><p>Cost</p></td></tr></thead><tbody><tr><td><p>@UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.items-and-spells.Item.j3dsBzGEvEFo6PGB]{Necromantic
        Draught}</p></td><td><p>4 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.Xbq8CyXSRV358SfP]{Oil of
        Etherealness}</p></td><td><p>4 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.ctKfjHjk9gs9UtZI]{Potion of
        Speed}</p></td><td><p>4 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.4ZiJsDTRA1GgcWKP]{Potion of Stone
        Giant Strength}</p></td><td><p>4 reagent
        dice</p></td></tr></tbody></table><p></p><h3>Alchemy of Influence</h3><p><em>Prerequisite:
        13th level</em></p><p>Your alchemical research has revealed many of the basic chemicals that
        govern emotions. You can brew the following
        potions:</p><p></p><table><thead><tr><td><p>Potion</p></td><td><p>Cost</p></td></tr></thead><tbody><tr><td><p>@UUID[Compendium.dnd5e.items.nXWevqtV6p484N59]{Potion
        of Animal Friendship}</p></td><td><p>1 reagent
        die</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.63nb14yQRJMc4bIn]{Philter of
        Love}</p></td><td><p>2 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.bAyr7j5Peq9wIJTa]{Potion of
        Clairvoyance}</p></td><td><p>3 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.Ct9LR9Ft1FG4a6Y1]{Potion of Mind
        Reading}</p></td><td><p>3 reagent dice</p></td></tr></tbody></table><p></p><h3>Alchemy of
        Transformation</h3><p><em>Prerequisite: 13th level</em></p><p>You have mastered the
        alchemical secrets of shifting matter, which allow you to brew the following
        potions:</p><p></p><table><thead><tr><td><p>Potion</p></td><td><p>Cost</p></td></tr></thead><tbody><tr><td><p>@UUID[Compendium.dnd5e.items.FIDyR0kZnxGy7bj8]{Oil
        of Slipperiness}</p></td><td><p>2 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.items-and-spells.Item.SWvO5S0uuLpohGim]{Sandstone
        Solution}</p></td><td><p>2 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.items-and-spells.Item.odbsYuL4x0E1ZooY]{Aqua
        Fortis}</p></td><td><p>3 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.mage-hand-press-valdas-spire-of-secrets.items-and-spells.Item.1MdHby7I36WEouCA]{Chameleon
        Concoction}</p></td><td><p>3 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.bqZ6NTLDCUB98YjV]{Potion of
        Gaseous Form}</p></td><td><p>3 reagent dice</p></td></tr></tbody></table><p></p><h3>Arcane
        Study</h3><p>You learn three cantrips of your choice from the wizard spell list.
        Intelligence is your spellcasting ability for your wizard spells.</p><h3>Ballistics
        Research</h3><p>You learn two additional bomb formulae.</p><h3>Battle Training</h3><p>You
        gain proficiency with martial weapons and shields.</p><h3>Beguiling
        Haze</h3><p><em>Prerequisites: 13th level, Amorist Field of Study</em></p><p>When you charm
        a creature, you can choose to place it in a dreamy state, from which it regards everyone it
        sees as close friends. While the creature is charmed, it is nonhostile and acts as though it
        is charmed equally by each creature it sees.</p><p>Once you use this ability, you can’t use
        it again until you finish a short or long rest.</p><h3>Buffered
        Metabolism</h3><p><em>Prerequisites: 13th level, Xenoalchemist Field of Study</em></p><p>As
        a reaction when you take damage, you can expend any number of reagent dice up to your
        proficiency bonus to reduce the amount of damage taken by the total rolled on the
        dice.</p><h3>Clotting Agent</h3><p>You have developed a serum that thickens your blood. Your
        hit point maximum increases by your alchemist level + your Constitution modifier, and it
        increases by 1 again whenever you gain a level in this class.</p><h3>Craft
        Homunculus</h3><p>Using a special alchemical process requiring 8 hours of work, which can be
        performed over the course of a long rest, you can create a homunculus. A homunculus
        functions as a familiar summoned by the
        <em>@UUID[Compendium.dnd5e.spells.JGT5bNqu9REL7Fuz]{find familiar}</em> spell, with several
        differences:</p><ul><li><p>The telepathic link between you and your homunculus functions at
        any distance, provided you and your homunculus are on the same plane of
        existence.</p></li><li><p>You can’t dismiss your homunculus as you would a
        familiar.</p></li><li><p>Your homunculus is a Construct and can’t assume a different
        form.</p></li><li><p>Your homunculus can take the Attack action on its
        turn.</p></li></ul><p>When your homunculus dies, its body remains, and can be reanimated in
        a procedure requiring 1 hour of work, which can be performed over the course of a short or
        long rest.</p><h3>Demolition Spree</h3><p><em>Prerequisites: 13th level, Mad Bomber Field of
        Study</em></p><p>When you prime and throw a bomb, you can choose to throw a number of bombs
        equal to the number of damage dice for the bomb instead of only one. Each bomb you throw
        deals 1d10 damage plus your Intelligence modifier and can’t target the same creature or
        space. You must spend reagent dice separately on these bombs and can apply a bomb formula to
        only one of them.</p><h3>Explosive Missile</h3><p>As a bonus action, you can load one of
        your bombs onto the head of a crossbow bolt. Instead of its normal damage, this bolt deals
        damage as if the bomb had been primed and thrown, but it doesn’t have a blast radius. Only
        one of your bombs can be loaded onto a bolt at a time, and you can’t fire an explosive bolt
        on the same turn you throw a bomb.</p><h3>Fire Brand</h3><p>As a bonus action you can mix
        your bomb’s contents together and apply the fiery concoction to a melee weapon you are
        holding. Until the end of your turn, this melee weapon deals an extra 1d6 fire damage on a
        hit. This extra damage increases by 1d6 at 5th level (2d6), 11th level (3d6), and 17th level
        (4d6).</p><h3>Fire Eater</h3><p>Instead of priming and throwing a bomb, you use an action to
        drink its contents and spit them out in a 15-foot cone. Each creature within the cone must
        make a Dexterity saving throw against your bomb save DC. On a failed save, a creature takes
        fire damage as if the bomb had been primed and thrown, or half as much on a successful save.
        When you use this ability, you take 1d4 points of fire damage for each of your bomb’s damage
        dice.</p><h3>Fire in the Hole</h3><p><em>Prerequisite: 9th level</em></p><p>You have tweaked
        your bomb’s formula to increase its explosive yield. Your bomb save DC increases by half
        your proficiency bonus, rounded down.</p><h3>Fortified Serum</h3><p><em>Prerequisites: 13th
        level, Apothecary Field of Study</em></p><p>Whenever a creature regains hit points by
        drinking one of your potions, it gains resistance to bludgeoning, piercing, and slashing
        damage from nonmagical attacks until the end of its next turn.</p><h3>Grenadier</h3><p>When
        you prime and throw a bomb, you can use your bonus action to make an attack with a weapon
        that isn’t two-handed.</p><h3>Dynamo Charger</h3><p><em>Prerequisites: 13th level, Dynamo
        Engineer Field of Study</em></p><p>You’ve invented a device that rapidly recharges your
        spell dynamos. Once per day when you finish a short rest, you can regain 2 expended spell
        slots stored in dynamos. You can configure these dynamos
        immediately.</p><h3>Hemoreagent</h3><p><em>Prerequisite: 17th level</em></p><p>When you
        prime and throw a bomb, you can convert a measure of your own blood into reagents. You can
        add five or fewer reagent dice to the bomb’s damage roll without expending them, and you
        lose 1d6 hit points for each reagent die added. This loss of hit points can’t be reduced or
        prevented in any way.</p><h3>Lazarus Bolt</h3><p><em>Prerequisite: 9th
        level</em></p><p>You’ve discovered a radical necromantic workaround: restoring life with
        direct electricity to the heart. As an action, you can drive a bolt into the torso of a
        creature within 5 feet of you that has died within the last minute and shock it back to
        life. That creature returns to life with 1 hit point. This feature can’t return to life a
        creature that lacks a heart, a creature that has died of old age, or a creature that is
        missing vital organs.</p><p>Once you use this ability, you can’t use it again until you
        finish a short or long rest.</p><h3>Magnified Blast</h3><p><em>Prerequisite: 17th
        level</em></p><p>Thanks to a new internal design for your bombs, you have expanded their
        blast radius and magnitude. Whenever you add reagent dice to your bomb’s damage, you can
        also choose to expand the bomb’s blast radius by a distance of up to 5 feet per two reagent
        dice spent.</p><h3>Ooze Cowboy</h3><p><em>Prerequisites: 13th level, Ooze Rancher Field of
        Study</em></p><p>Tired of waiting for your Oozes to catch up with you, you’ve modified your
        formula to make extra fast slimes! All slimes you make have a speed of 30 feet, unless it
        was already higher. Additionally, you can ride any Ooze you make of Medium size or larger as
        a mount. You and your equipment suffer no ill effect from touching your Oozes directly.
        Lastly, your Oozes add your proficiency bonus to their damage rolls and initiative
        rolls.</p><h3>Poisoner</h3><p>Your research into poisonous compounds has taught you how to
        concoct lethal toxins. You gain proficiency with the poisoner’s kit. Additionally, you can
        craft the following poisons when you brew potions, which use your bomb save DC instead of
        their normal save
        DCs:</p><p></p><table><thead><tr><td><p>Potion</p></td><td><p>Cost</p></td></tr></thead><tbody><tr><td><p>2
        x @UUID[Compendium.dnd5e.items.Fc6UfFNOnW80XMzi]{Antitoxin}</p></td><td><p>1 reagent
        die</p></td></tr><tr><td><p>2 x @UUID[Compendium.dnd5e.items.eVbPkYjpl29RE2uW]{Basic
        Poison}</p></td><td><p>1 reagent die</p></td></tr><tr><td><p>Oil of Taggit</p></td><td><p>2
        reagent dice</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.qBSEGJyHxdKIlBfj]{Potion
        of Poison}</p></td><td><p>2 reagent dice</p></td></tr><tr><td><p>Serpent
        Venom</p></td><td><p>2 reagent
        dice</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.a86F565Pjdzym1jH]{Truth
        Serum}</p></td><td><p>2 reagent dice</p></td></tr></tbody></table><blockquote><p>Foundry
        Note: Oil of Taggit and Serpent Venom can be found
        @UUID[Compendium.dnd5e.rules.t6scHTmpmHBTZGTX.JournalEntryPage.B8rYvLQ4jMY9GeJA#sample-poisons]{here}!</p></blockquote><p></p><h3>Precision
        Explosives</h3><p>You have modified your bombs to have narrow gaps in their explosions,
        perfect for keeping some creatures safe from the blast. You can choose one creature in the
        blast radius of a bomb, other than the target, to automatically succeed on its saving throw
        against the bomb and take no damage from it.</p><h3>Reactionary
        Gulp</h3><p><em>Prerequisite: 17th level</em></p><p>By keeping your potions organized on a
        bandolier or in a series of pouches, you can quickly draw them at a moment’s notice.
        Immediately after you take damage, you can use your reaction to drink a
        potion.</p><h3>Recycled Potions</h3><p>When you brew potions, you can distill potions you
        have already brewed, destroying them and regaining the reagent dice expended to brew them.
        You can choose to expend these reagent dice to create new potions. You can’t gain more than
        your maximum number of reagent dice using this ability.</p><h3>Syringe</h3><p>Using a
        sophisticated hypodermic needle, you can more quickly administer potions and poisons. As a
        bonus action, you can inject a potion into yourself or a willing creature within 5 feet of
        you, granting the benefits of the potion as if it were consumed normally. You can inject a
        potion into an unwilling creature with a successful melee attack, treating the syringe as a
        finesse weapon.</p><h3>Tri-Mutation</h3><p><em>Prerequisites: 13th level, Mutagenist Field
        of Study</em></p><p>You’ve developed a powerful, but fleeting way to blend your mutagens.
        When you inject yourself with a mutagen, you can choose to inject a tri-mutagen, which
        grants you the benefit of all your mutagens at once. This benefit lasts for 1 minute, or
        until you inject yourself with a different mutagen. Once you use this ability, you can’t use
        it again until you finish a long rest.</p></div>
