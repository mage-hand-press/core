          <p>Investigators can add the following spells to their grimoires. Spells marked with an
          asterisk (*) are new to this class and spells marked with a dagger (†) are counted as if
          they had the ritual tag. This list is not exclusive; if you use additional ritual spells
          in your game that are not included on this list, you can add these spells to your grimoire
          and cast them as rituals.</p>
