  - sort: 400000
    name: Investigator
    type: class
    _id: mhpInvestigator0
    system:
      description:
        value: >-
          <p>@Embed[Compendium.mage-hand-press-core.classes14.Item.mhpClasInvestiga caption=false
          nameStyle=h1 no-toc]</p><h2>Paranormal Investigators</h2><p>There are forces more ancient
          than time, foes more sinister than the foulest men, and beings more titanic than gods. The
          world stands on a precipice of woe and terror, being threatened nightly by dark agents and
          hordes of monsters. At risk to their own lives and sanities, investigators penetrate the
          evil that creeps in the shadows and banish it from the world. Their battles are
          never-ending, for victory only delays doomsday another night.</p><p>Investigators track
          supernatural threats ranging from incorporeal spirits, to nefarious vampires and
          lycanthropes, to incursions of demons and devils. Often in their investigations, they
          uncover secret cults and maligned individuals who bring these supernatural threats to
          bear. It is always their goal to impede these evildoers by any means necessary, resorting
          to trickery, guile, magic, and bloodshed when necessary. To an investigator, no tactic is
          unthinkable when the world is at stake.</p><h2>Exorcists and Occultists</h2><p>Even as
          they strive to contain its influence from the world at large, investigators dabble in
          forbidden magic to give themselves an edge against supernatural threats. Prepared
          investigators keep a well-stocked grimoire of magical secrets, containing rituals,
          incantations, notes on monsters’ powers and weaknesses, recipes for poisons, and arcane
          diagrams—everything needed to confront their foes on an even footing. Even so, an
          investigator’s occupation is perilous. A grimoire might spell out a vampire’s fear of
          sunlight and aversion to silver, but it does little to hinder their fangs.</p><h2>Creating
          an Investigator</h2><p>As you build your investigator, consider what sort of supernatural
          threat first drove you to investigating and combating the occult. Did one of your family
          members strike a bargain with a fiend? Were you kidnapped by a cabal of vampires or a pack
          of lycanthropes? Did you stumble across evidence of an eldritch abomination, such as a
          Great Old One? The type of creature you first did battle with likely shaped your tools and
          methods later on.</p><p>Did you apprentice under a seasoned monster hunter, learning the
          ropes of tracking a threat, uncovering its weaknesses, and setting a trap for it? Or did
          you strike out on your own, compiling your own grimoire from hard-earned research? Perhaps
          you learned everything about monster hunting from someone else’s grimoire, a masterwork
          containing an abridged library of occult knowledge and a lifetime of experience. It’s even
          possible that you signed a contract with a minor fiend and turned to supernatural
          investigation in a last-ditch effort to save your soul.</p><h3>Quick Build</h3><p>Follow
          these suggestions to build an investigator quickly: Intelligence should be your highest
          ability score, followed by Dexterity or Strength. Then, select the rituals <em>clue</em>,
          <em>comprehend languages</em>, <em>detect magic</em>, and <em>transient bulwark</em> to
          add to your grimoire. Finally, pick any background, preferably one that relates to your
          experience with supernatural monsters and the occult.</p>
