name: Investigator
type: class
img: modules/mage-hand-press-valdas-spire-of-secrets/assets/options/investigator.webp
system:
  description:
    value: >-
      <p>Supernatural detectives and monster slayers, Investigators are always on the hunt for
      malevolent outsiders. Whenever evil seeps into the world—be it Fiends, Undead, or strange
      Aberrations from beyond the stars—Investigators will be the first to locate them and banish
      their foul corruption from the mortal plane.</p><h3>Paranormal Investigators</h3><p>There are
      forces more ancient than time, foes more sinister than the foulest men, and beings more
      titanic than gods. Investigators risk their lives and psyches to protect the world from
      supernatural threats, unraveling the mysteries of one werewolf or demonic cult at a time.
      Their investigations are never ending, for victory only delays doomsday another
      night.</p><h3>Exorcists and Occultists</h3><p>To give themselves an edge against supernatural
      threats, Investigators dabble in forbidden magic themselves. Prepared Investigators keep a
      well-stocked grimoire of rituals, incantations, and notes on the powers and weaknesses of
      monsters—everything needed to level the playing field. Even so, an Investigator’s occupation
      is perilous. A grimoire might spell out a vampire’s fear of sunlight and aversion to silver,
      but it does little to hinder their fangs.</p><p
      class="hide-in-embed"><em>@UUID[Compendium.mage-hand-press-core.journal.JournalEntry.mhpInvestigat55e.JournalEntryPage.mhpInvestigator0]{Class
      Details}</em></p><h3>Becoming an Investigator…</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Investigator Traits
      table.</p></li><li><p>Gain the Investigator’s level 1 features, which are listed in the
      Investigator Features table.</p></li></ul><h4>As a Multiclass Character</h4><ul><li><p>Gain
      the following traits from the Core Investigator Traits table: Hit Point Die, proficiency in
      one skill of your choice from the Investigator’s skill list, proficiency with Martial Weapons,
      and training with Light Armor.</p></li><li><p>Gain the Investigator’s level 1 features, which
      are listed in the Investigator Features table.</p></li></ul>
