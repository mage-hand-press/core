name: Rushed Incantation
type: feat
img: icons/sundries/books/book-worn-brown-grey.webp
system:
  description:
    value: >-
      <p>You can hastily perform any spell in your grimoire that has a casting time of an action or
      Bonus Action, casting the spell as a Bonus Action. You can cast it without Material components
      unless the components have a cost of 100+ GP specified by the spell.</p><p>You can use this
      feature three times. You regain one of its expended uses when you finish a Short Rest, and you
      regain all expended uses when you finish a Long Rest. You gain additional uses when you reach
      certain Investigator levels, as shown in the Rushed Incantation column of the Investigator
      Features table.</p>
