system:
  description:
    value: >-
      <p>Your research has taught you how to create an alchemical
      homunculus.</p><p>@Embed[.Activity.ffnETGUJdLAQdM5m caption=false cite=false
      nameStyle=inline]</p><p><em><strong>Hit Points.</strong></em> Your homunculus has Hit Points
      equal to five times your Alchemist level.</p><p><em><strong>Bomb Immunity.</strong></em> Your
      homunculus automatically succeeds on its saving throws against your Bombs and never takes
      damage from them.</p><p><em><strong>Combat.</strong></em> The homunculus is an ally to you and
      your allies. It takes its turn immediately before or after your turn each round (your choice).
      Your homunculus can’t attack on its turn, but it can take other actions and Bonus Actions as
      normal.</p><p>Additionally, you can take a Bonus Action to command your homunculus to make one
      attack with its Reaction. Your homunculus’s attack bonus equals your Intelligence modifier
      plus your Proficiency Bonus.</p><p>@Embed[.Activity.E2Vli8HCCmmgrt1f caption=false cite=false
      nameStyle=inline]</p>
