system:
  description:
    value: >-
      <p>Dabbling in arcana has granted you limited magic. You gain the following
      benefits.</p><p><em><strong>Two Cantrips.</strong></em> You learn two cantrips of your choice
      from the Wizard spell list. Intelligence is your spellcasting ability for this Discovery’s
      spells.</p><p><em><strong>Level 1 and 2 Spells.</strong></em> Choose a level 1 spell and a
      level 2 spell from the Wizard spell list. You always have these spells prepared. You can cast
      each once without a spell slot, and you regain the ability to cast it in that way when you
      finish a Long Rest. You can also restore your use of a spell by taking the
      &amp;Reference[Magic] action and expending a number of Reagents equal to the level of the
      spell. You can also cast these spells using any spell slots you have of the appropriate
      level.</p><p><em><strong>Spell Change.</strong></em> Whenever you gain a new level, you can
      replace one of the spells you chose for this Discovery with a different spell of the same
      level from the Wizard spell list.</p>
