    value: >-
      <p>Your Bombs are extremely precise. You gain the following
      benefits.</p><p><em><strong>Improved Bombs.</strong></em> You gain a +1 bonus to your
      Alchemist save DC. This bonus increases to +2 when you reach Alchemist level
      11.</p><p><em><strong>Sculpt Explosion.</strong></em> When you use the Bomb’s Explode
      property, you can choose a number of creatures within the explosion up to your Intelligence
      modifier (minimum of 1). Each chosen creature automatically succeeds on its saving throws
      against the Bomb and takes no damage from it.</p>
