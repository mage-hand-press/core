  advancement: {}
  description:
    value: >-
      <p>Your research has revealed the finer points of brewing basic alchemical substances. You
      gain the following benefits.</p><p><em><strong>Quadruple Flasks.</strong></em> When you brew
      potions, you can brew a batch of four vials of
      @UUID[Compendium.dnd5e.equipment24.Item.phbagAcid0000000]{Acid},
      @UUID[Compendium.dnd5e.equipment24.Item.phbagAlchemistsF]{Alchemist’s Fire},
      @UUID[Compendium.dnd5e.equipment24.Item.phbagHolyWater00]{Holy Water}, or
      @UUID[Compendium.dnd5e.equipment24.Item.phbagOil00000000]{Oil} for 1 Reagent. Each batch
      counts as one potion for the number of potions you can have at once. These batches can be all
      of one substance or a mix of them. These substances use your Alchemist save DC and retain
      potency until you finish a Long Rest, after which they become
      inert.</p><p>@Embed[.Activity.6HB6zQF81XxACSyt caption=false cite=false
      nameStyle=inline]</p><p><em><strong>Potent Flasks.</strong></em> Acid, Alchemist’s Fire, and
      Holy Water that you brew deal an additional die of damage. Alchemist’s Fire also deals this
      extra die of damage to burning creatures. Burning Oil adds your Intelligence modifier to the
      extra Fire damage it deals.</p>
    chat: ''
