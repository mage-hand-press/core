system:
  description:
    value: >-
      <p>Whether their methods are explosive, transformative, or restorative, Alchemists transmute
      the world around them to their liking.</p><h3>Explosive Reactions</h3><p>One of the first
      things an Alchemist learns is which chemicals react explosively with one other. Ostensibly,
      this is to prevent deadly accidents, but adventuring Alchemists regularly apply this knowledge
      to create Bombs.</p><p>An alchemical bomb is a one-pound, apple-sized, spherical glass or clay
      flask filled with a reactive chemical. A smaller vial of thin glass containing a reagent is
      suspended in the liquid, and the whole thing is sealed with a cork or wax seal. When the inner
      vial breaks, usually on impact, the chemicals react with a violent explosion. With
      experimentation, an Alchemist can even infuse these explosions with elemental fire, lightning,
      or frost.</p><h3>Serums and Tinctures</h3><p>Experienced Alchemists learn to brew potions,
      alchemical concoctions that replicate magical effects. These range from the medicinal, such as
      <em>Potions of Healing</em>, to the transformative, such as <em>Potions of Gaseous Form</em>.
      Undisputed masters of potion-brewing, an adventuring Alchemist should have a surplus of
      potions to distribute among their allies.</p><h3>Elemental Sciences</h3><p>The source of
      alchemy’s power is the Elemental Planes. Therefore, it is no surprise that Alchemists strive
      to tap deeper into that power, researching and discovering new elemental compounds. The
      pinnacle of alchemy is the Philosopher’s Stone, which is rumored to grant its bearer supreme
      command of the elements. Few Alchemists have succeeded in creating a Philosopher’s Stone, and
      fewer still remain alive to divulge its secrets.</p><p
      class="hide-in-embed"><em>@UUID[Compendium.mage-hand-press-core.journal.JournalEntry.mhpAlchemist5e00.JournalEntryPage.mhpAlchemist0000]{Class
      Details}</em></p><h3>Becoming an Alchemist…</h3><h4>As a Level 1 Character</h4><ul><li><p>Gain
      all the traits in the Core Alchemist Traits table.</p></li><li><p>Gain the Alchemist’s level 1
      features, which are listed in the Alchemist Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the following traits from the Core Alchemist Traits table: Hit
      Point Die, proficiency in one skill of your choice from the Alchemist’s skill list,
      proficiency with Alchemist’s Supplies, and training with Light armor.</p></li><li><p>Gain the
      Alchemist’s level 1 features, which are listed in the Alchemist Features table.</p></li></ul>
