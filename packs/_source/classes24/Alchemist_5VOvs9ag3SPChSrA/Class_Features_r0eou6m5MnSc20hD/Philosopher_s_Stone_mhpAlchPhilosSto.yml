      Benefits.</strong></em> As long as you possess the stone, you gain the following
      benefits:</p><div class="subfeature"><p><strong>Regenerating Reagents.</strong> When you roll
      Initiative, you regain expended Reagents until you have 6 if you have 5 or
      fewer.</p><p><strong>Quick Brewing.</strong> You can brew potions as a &amp;Reference[Utilize]
      action, instead of over the course of 10 minutes.</p><p><strong>Longevity.</strong> For every
      ten years that pass, your body ages only one year.</p></div>
