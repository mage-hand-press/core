system:
  description:
    value: >-
      <p>You can create volatile alchemical Bombs using the statistics shown in the Bomb
      sidebar.</p><p><em><strong>Bomb Mastery.</strong></em> You have proficiency with Bombs and you
      can use the Bomb’s mastery property.</p><p><em><strong>Intelligent Explosions.</strong></em>
      When you use the Bomb’s Explode property, you can gain a bonus to the damage roll equal to
      your Intelligence modifier (minimum of +1).</p><p><em><strong>Alchemist Save DC.</strong></em>
      Some of your Alchemist features require your target to make a saving throw. The save DC equals
      8 plus your Intelligence modifier and Proficiency Bonus. You can use this save DC for your
      Bombs instead of the DC specified in the Explode property.</p><p></p>
