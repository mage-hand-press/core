system:
  description:
    value: >-
      <p>You can spend 10 minutes and expend any number of Reagents to brew potions, which can be
      done during a Short Rest. The number of Reagents and the Alchemist level required to brew a
      potion are given on the Potions table. You can have a total number of potions at one time up
      to your Intelligence modifier (minimum of 1). These potions retain potency until you finish a
      Long Rest, after which they become inert.</p><p>When you brew potions, you can also distill
      potions you have already brewed, destroying them and recovering the Reagents expended to brew
      them, up to a maximum of the number of Reagents listed on the Alchemist Features table. You
      can expend these Reagents immediately to brew new potions.</p><p>Your potions don’t have
      unpredictable effects if a creature drinks one of your potions while still under the effects
      of
      another.</p><p>@Embed[Compendium.mage-hand-press-core.journal.JournalEntry.mhpEmbeds55e0000.JournalEntryPage.mhpPotions000000
      inline]</p>
