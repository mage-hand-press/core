name: Bomb
type: weapon
img: icons/weapons/thrown/bomb-fuse-cloth-pink.webp
system:
  description:
    value: >-
      <p>When a bomb hits a target, it explodes in a 15-foot diameter sphere and is destroyed. The
      bomb can be thrown at an unoccupied space within its range. Each creature other than the
      target within the blast radius (for a Medium or smaller target, each creature within 5 feet of
      it) must make a DC 11 Dexterity saving throw, taking half the damage rolled on a failed save,
      or no damage on a successful one.</p><p>Additionally, as a bonus action, you can empty some of
      the bomb’s explosive material to permanently remove the blast radius from this bomb, dealing
      damage only to the bomb’s target.</p>
